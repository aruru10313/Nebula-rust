name: Build Nebulya Launcher

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build + Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release 첨부용 쓰기 권한 (태그 푸시 때만 사용)
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Linux eframe/egui 의존성 (X11/Wayland/glow)
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb1-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libssl-dev pkg-config

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # ---------- OS별 설치 파일 ----------
      - name: Install cargo-deb (Linux)
        if: runner.os == 'Linux'
        run: cargo install cargo-deb

      - name: Package (Linux → tar.gz + .deb)
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh ${{ matrix.target }}

      - name: Package (macOS → .app tar.gz + .dmg)
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh ${{ matrix.target }}

      - name: Build installer (Windows → Setup exe)
        if: runner.os == 'Windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/windows/nebulya-setup.iss
          options: /DBinaryDir=${{ github.workspace }}\target\${{ matrix.target }}\release

      - name: Collect Windows dist
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/windows
          cp "target/${{ matrix.target }}/release/nebulya-launcher${{ matrix.ext }}" dist/windows/
          ls -lh dist/windows

      # ---------- Release에 직접 첨부 (아티팩트 미사용 → 할당량 소모 없음) ----------
      # 일반 푸시에서는 여기까지만 (컴파일+패키징 검증). 태그 푸시에서만 파일 첨부.
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes --title "$TAG" \
            || true
          gh release upload "$TAG" dist/**/* --clobber
          echo "==> attached to release $TAG"
